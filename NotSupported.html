<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Supported MIDI</title>
</head>
<body style="margin: 0; background-color: bisque; display: flex; justify-content: center; align-items: center; height: 100%; flex-direction: column;">
    <h1 style="margin: 5vw 15vw; text-align: center; font-size: 3vw; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Sorry Man, your browser does not support the WEB MIDI API by this time</h1>
    <button id="tryAgain" style="border-radius: 2vw; font-size: 2vw; padding: 2vw; background-color: rgb(143, 255, 143);">Try Again</button>
</body>
    <script defer>
        const button = document.getElementById("tryAgain");

        button.addEventListener("click", () => {
            window.location.replace("index.html");
        })
    </script>
</html>
